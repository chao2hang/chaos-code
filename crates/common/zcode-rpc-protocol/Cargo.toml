[package]
license = "Apache-2.0"
name = "zcode-rpc-protocol"
version = "0.1.0"
edition.workspace = true
description = "Wire-format interop core for the zai-org/ZCode @zcode/rpc binary protocol (VQL framing + VS Code-style serialization), used by the Chaos RPC bridge"

[dependencies]
# preserve_order keeps JSON key order byte-compatible with the wire format
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }

[lints]
workspace = true
