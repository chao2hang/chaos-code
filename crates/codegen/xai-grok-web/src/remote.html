<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Chaos 远控</title>
<style>
  /* ===== 设计令牌：对齐官方 ZCode /remote/v4 的暗色语言 ===== */
  :root{
    --bg:#161616;            /* 页面底色 rgb(22,22,22) */
    --header:#1c1c1c;        /* 顶栏 */
    --card:#1e1e1e;          /* 卡片 */
    --card-2:#262626;        /* 卡内块 / 图标底 */
    --border:rgba(255,255,255,.09);
    --border-soft:rgba(255,255,255,.06);
    --text:#d4d4d4;          /* oklch(.87 0 0) */
    --text-strong:#f0f0f0;
    --muted:#8f8f8f;
    --faint:#6b6b6b;
    --green:#4ade80;         /* 状态胶囊 */
    --green-bg:rgba(74,222,128,.14);
    --red:#f87171;
    --red-bg:rgba(248,113,113,.12);
    --amber:#fbbf24;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 显式 display 的元素（#composer/.iconbtn）会压过 hidden 属性的 UA 样式，
     这里强制恢复，否则视图切换的 hidden 全部失效。 */
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overscroll-behavior-y:none;
  }
  #app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
  /* ===== 顶栏 ===== */
  header.app{
    flex-shrink:0;display:flex;align-items:center;gap:12px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:var(--header);border-bottom:1px solid var(--border-soft);
  }
  header.app .titles{flex:1;min-width:0}
  header.app h1{margin:0;font-size:19px;font-weight:700;color:var(--text-strong);letter-spacing:.2px}
  header.app .conn{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
  .conn-dot.off{background:var(--red)}
  .conn-dot.wait{background:var(--amber);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .iconbtn{
    flex-shrink:0;display:grid;place-items:center;width:36px;height:36px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;padding:0;
  }
  .iconbtn:active{background:var(--card-2)}
  .iconbtn svg{width:18px;height:18px}
  /* ===== 主体 ===== */
  main#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 8px}
  .empty{color:var(--faint);text-align:center;padding:64px 24px;font-size:14.5px;line-height:1.9}
  /* 信息横幅（连接说明） */
  .banner{
    background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:14px 16px;color:var(--muted);font-size:13.5px;line-height:1.7;margin-bottom:18px;
  }
  /* 区块头：标题 + 图标钮 + 计数行 */
  .section-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .section-row .section-title{flex:1;font-size:17px;font-weight:700;color:var(--text-strong)}
  .section-sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  /* ===== 工作区卡片（对齐官方：图标/名称/路径/计数/展开/新建） ===== */
  .ws-card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .ws-head{display:flex;align-items:center;gap:12px;padding:14px 14px}
  .ws-icon{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:var(--card-2);display:grid;place-items:center;color:var(--muted)}
  .ws-icon svg{width:20px;height:20px}
  .ws-main{flex:1;min-width:0}
  .ws-name{font-size:16.5px;font-weight:600;color:var(--text-strong);display:flex;align-items:center;gap:8px}
  .ws-path{font-size:13px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,monospace;margin-top:1px}
  .ws-updated{font-size:13px;color:var(--faint);margin-top:1px}
  .ws-count{color:var(--muted);font-size:14px;flex-shrink:0}
  .ws-new{flex-shrink:0;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
  .ws-new:active{background:var(--card-2)}
  .ws-toggle{background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;flex-shrink:0;display:grid;place-items:center}
  .ws-toggle svg{width:16px;height:16px;transition:transform .15s}
  .ws-card.collapsed .ws-toggle svg{transform:rotate(-90deg)}
  .ws-card.collapsed .ws-tasks{display:none}
  .ws-card.collapsed .ws-head{border-bottom:none}
  .ws-tasks{border-top:1px solid var(--border-soft)}
  /* 任务行 */
  .task-row{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:14px;border:none;background:none;color:var(--text);cursor:pointer;font:inherit;
  }
  .task-row:active{background:rgba(255,255,255,.03)}
  .task-row + .task-row{border-top:1px solid var(--border-soft)}
  .task-main{flex:1;min-width:0}
  .task-title{font-size:15.5px;color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-meta{font-size:13px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--green-bg);color:var(--green)}
  .chip svg{width:12px;height:12px}
  .dot{flex-shrink:0;width:9px;height:9px;border-radius:50%;background:var(--green)}
  /* ===== 会话页：文档流（官方无气泡，markdown 直排） ===== */
  .doc{padding:6px 2px 12px}
  .msg-user{position:relative;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px 14px;margin:18px 0 6px}
  .msg-user .who{font-size:12px;color:var(--faint);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
  .msg-user .who .copy{color:var(--faint);cursor:pointer;background:none;border:none;font-size:12px;padding:2px 6px;border-radius:6px}
  .msg-user .who .copy:active{background:var(--card-2)}
  .msg-user .body{font-size:15px;color:var(--text-strong);white-space:pre-wrap;word-break:break-word}
  .msg-assistant{margin:20px 0 6px}
  .msg-assistant .body{font-size:15px;color:var(--text);word-break:break-word}
  .msg-assistant.pending .body::after{content:"▍";color:var(--muted);animation:pulse 1s infinite}
  .actions{display:flex;align-items:center;gap:14px;color:var(--faint);font-size:12.5px;margin:4px 0 8px}
  .actions .copy{cursor:pointer;background:none;border:none;color:var(--faint);font-size:12.5px;padding:2px 4px}
  /* markdown 元素 */
  .body h1,.body h2,.body h3,.body h4{color:var(--text-strong);margin:14px 0 6px;line-height:1.4}
  .body h1{font-size:19px}.body h2{font-size:17px}.body h3{font-size:15.5px}.body h4{font-size:15px}
  .body p{margin:8px 0}
  .body ul,.body ol{margin:8px 0;padding-left:22px}
  .body li{margin:4px 0}
  .body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--card-2);border-radius:5px;padding:1.5px 5px;color:#e8c88f}
  .body pre{background:var(--card-2);border:1px solid var(--border-soft);border-radius:12px;padding:12px 14px;overflow-x:auto;margin:10px 0}
  .body pre code{background:none;padding:0;color:#cfe3cf}
  .body a{color:#7ab8ff}
  .body blockquote{border-left:3px solid var(--border);margin:8px 0;padding:2px 12px;color:var(--muted)}
  .body table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13.5px;display:block;overflow-x:auto}
  .body th,.body td{border:1px solid var(--border);padding:6px 10px;text-align:left;white-space:nowrap}
  .body th{background:var(--card-2);color:var(--text-strong)}
  .body hr{border:none;border-top:1px solid var(--border);margin:14px 0}
  /* 工具卡片（对齐官方文件卡样式） */
  .tool-card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);margin:12px 0;overflow:hidden}
  .tool-head{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .tool-icon{flex-shrink:0;width:38px;height:38px;border-radius:10px;background:var(--card-2);display:grid;place-items:center}
  .tool-icon svg{width:17px;height:17px}
  .tool-icon.ok{color:var(--green)}.tool-icon.run{color:var(--amber)}
  .tool-main{flex:1;min-width:0}
  .tool-name{font-size:14.5px;color:var(--text-strong);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tool-sub{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .tool-toggle{background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;display:grid;place-items:center}
  .tool-toggle svg{width:15px;height:15px;transition:transform .15s}
  .tool-card.open .tool-toggle svg{transform:rotate(90deg)}
  .tool-body{display:none;border-top:1px solid var(--border-soft);padding:10px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-all;max-height:280px;overflow-y:auto}
  .tool-card.open .tool-body{display:block}
  /* 思考过程 */
  details.reasoning{margin:10px 0}
  details.reasoning summary{cursor:pointer;color:var(--faint);font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
  details.reasoning summary::-webkit-details-marker{display:none}
  details.reasoning summary::before{content:"▸";transition:transform .15s;display:inline-block}
  details.reasoning[open] summary::before{transform:rotate(90deg)}
  details.reasoning .body{border-left:2px solid var(--border);padding:4px 12px;margin-top:6px;color:var(--faint);font-size:13.5px}
  .load-earlier{display:block;width:100%;margin:12px 0;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:13.5px;cursor:pointer}
  /* ===== 亮色主题（官方 themeMenu）：html.light 切换变量组 ===== */
  html.light{--bg:#f5f5f4;--header:#ffffff;--card:#ffffff;--card-2:#eeeeec;--border:rgba(0,0,0,.10);--border-soft:rgba(0,0,0,.06);--text:#3f3f3f;--text-strong:#1c1c1c;--muted:#737373;--faint:#9a9a9a;--green:#16a34a;--green-bg:rgba(22,163,74,.12);--red:#dc2626;--red-bg:rgba(220,38,38,.08);--amber:#d97706}
  html.light #send{background:#262626;color:#ffffff}
  html.light .body code{background:var(--card-2);color:#9a6b1f}
  /* ===== 命令面板（官方 quickPick） ===== */
  #palette{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 0}
  .palette-card{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .palette-input{width:100%;border:none;outline:none;background:var(--header);color:var(--text-strong);font-size:16px;padding:14px 16px}
  .palette-input::placeholder{color:var(--faint)}
  .palette-list{max-height:52vh;overflow-y:auto;padding:6px}
  .palette-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;color:var(--text);font:inherit;font-size:15px;padding:12px 12px;border-radius:var(--radius-sm);cursor:pointer}
  .palette-item:active,.palette-item.hot{background:var(--card-2)}
  .palette-item .pi-hint{margin-left:auto;font-size:12px;color:var(--faint);flex-shrink:0}
  .palette-empty{color:var(--faint);text-align:center;padding:26px 0;font-size:14px}
  .palette-section{font-size:12px;color:var(--faint);padding:10px 12px 4px}
  /* ===== 会话内查找（官方 quickPick.find） ===== */
  #findbar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--header);border-bottom:1px solid var(--border-soft)}
  #findbar input{flex:1;min-width:0;border:none;outline:none;background:var(--card);color:var(--text-strong);font-size:14px;padding:8px 10px;border-radius:var(--radius-sm)}
  #findbar .find-count{font-size:12.5px;color:var(--muted);white-space:nowrap;flex-shrink:0}
  #findbar mark{background:var(--amber);color:#161616;border-radius:3px;padding:0 1px}
  #findbar mark.hot{background:var(--green);color:#161616}
  /* ===== 任务状态标签（官方四态 + 等待确认） ===== */
  .chip.idle{background:var(--card-2);color:var(--muted)}
  .chip.error{background:var(--red-bg);color:var(--red)}
  .chip.wait{background:var(--amber);color:#161616}
  .chip.running{background:var(--green-bg);color:var(--green)}
  /* 整理/排序切换行 */
  .toolbar-row{display:flex;align-items:center;gap:8px}
  .seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0}
  .seg button{border:none;background:none;color:var(--muted);font-size:12.5px;padding:7px 12px;cursor:pointer;font-family:inherit}
  .seg button.hot{background:var(--card-2);color:var(--text-strong)}
  /* ===== 审批 / 提问卡片 ===== */
  #cards{flex-shrink:0;padding:0 14px}
  .ask-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
  .ask-card .ask-title{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text-strong);font-size:15px;margin-bottom:6px}
  .ask-card .ask-title svg{width:16px;height:16px;color:var(--amber)}
  .ask-card .ask-summary{font-size:14px;color:var(--muted);word-break:break-word;white-space:pre-wrap;margin-bottom:12px}
  .ask-actions{display:flex;gap:10px}
  .ask-actions button{flex:1;padding:11px 0;border-radius:var(--radius-sm);font-size:15px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text)}
  .ask-actions .primary{background:var(--green-bg);border-color:transparent;color:var(--green);font-weight:600}
  .ask-actions .danger{color:var(--red)}
  .ask-actions button:active{opacity:.7}
  /* ===== 状态条 / toast ===== */
  #status{flex-shrink:0;text-align:center;font-size:13px;color:var(--amber);padding:4px 14px;min-height:0}
  #status:empty{display:none}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:#2e2e2e;color:var(--text-strong);font-size:14px;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw}
  #toast.show{opacity:1}
  /* ===== Composer（对齐官方：圆角卡 + 方形发送钮） ===== */
  #composer{
    flex-shrink:0;display:flex;flex-direction:column;gap:0;
    margin:8px 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--card);border:1px solid var(--border);border-radius:18px;padding:10px 10px 8px;
  }
  #input{
    width:100%;border:none;background:none;color:var(--text-strong);font:15px/1.55 inherit;font-family:inherit;
    resize:none;outline:none;max-height:132px;padding:4px 6px 8px;
  }
  #input::placeholder{color:var(--faint)}
  .composer-row{display:flex;align-items:center;gap:8px}
  .ws-chip{font-size:12px;color:var(--faint);background:var(--card-2);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
  .composer-row .spacer{flex:1}
  #send{
    flex-shrink:0;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:none;
    background:var(--text);color:#161616;cursor:pointer;
  }
  #send:active{opacity:.8}
  #send.stop{background:var(--red-bg);color:var(--red)}
  #send svg{width:18px;height:18px}
  .spinner{flex-shrink:0;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--muted);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header class="app">
    <button id="back" class="iconbtn" hidden aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="titles">
      <h1>Chaos 远程控制</h1>
      <div class="conn"><span id="conn-dot" class="conn-dot wait"></span><span id="conn-text">连接中…</span></div>
    </div>
    <button id="switch-desktop-btn" class="iconbtn" aria-label="切换至电脑端" title="切换至电脑端 (PC)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </button>
    <button id="palette-btn" class="iconbtn" aria-label="命令面板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button id="theme-btn" class="iconbtn" aria-label="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <button id="refresh" class="iconbtn" aria-label="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
    </button>
  </header>

  <div id="findbar" hidden>
    <input id="find-input" placeholder="搜索消息…" enterkeyhint="search">
    <span id="find-count" class="find-count"></span>
    <button id="find-prev" class="iconbtn" style="width:32px;height:32px" aria-label="上一个"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg></button>
    <button id="find-next" class="iconbtn" style="width:32px;height:32px" aria-label="下一个"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <button id="find-close" class="iconbtn" style="width:32px;height:32px" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>

  <main id="view"></main>

  <div id="cards"></div>
  <div id="status"></div>

  <div id="composer" hidden>
    <textarea id="input" rows="1" placeholder="提出后续修改要求…" enterkeyhint="enter"></textarea>
    <div class="composer-row">
      <span id="ws-chip" class="ws-chip" hidden></span>
      <span class="spacer"></span>
      <span id="busy-spin" class="spinner" hidden></span>
      <button id="send" aria-label="发送">
        <svg id="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="palette" hidden>
  <div class="palette-card">
    <input id="palette-input" class="palette-input" placeholder="输入命令…" enterkeyhint="search" autocomplete="off">
    <div id="palette-list" class="palette-list"></div>
  </div>
</div>
<script>
/* ================= 状态 ================= */
const app = {
  ws: null,
  connected: false,             // 收到 handshake 才算真连上
  retry: 0,
  workspaces: new Map(),        // id → WorkspaceInfo
  sessions: [],                 // SessionInfo[]（过滤归档）
  current: null,                // 打开的会话（本地增强对象）
  pendingSnapshot: null,        // 等待快照的 session_id
  busy: false,
  expectUser: null,             // 本端 Submit 已渲染的用户行，等 TurnStarted 抵消
  expectCreate: false,          // 本端刚点过新建任务，下一个 session_created 归我
  collapsed: new Set(),         // 收起的工作区 id
  // 官方 mobileHome 的整理/排序（localStorage 持久化，对齐 prefs key 语义）
  organize: localStorage.getItem("chaos-remote-organize") || "workspace", // workspace | timeline
  sortBy: localStorage.getItem("chaos-remote-sort") || "updated",         // updated | created
  // 会话运行态（官方 taskStatus 四态）：由广播事件实时跟踪
  running: new Set(),           // session_id → 运行中
  errored: new Set(),           // session_id → 上轮出错
  waiting: new Set(),           // session_id → 等待确认（审批/提问）
};
const $ = (id) => document.getElementById(id);
function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function send(obj){
  if (!app.ws || app.ws.readyState !== 1) return false;
  app.ws.send(JSON.stringify(obj));
  return true;
}

/* ================= 连接（断线指数退避重连） ================= */
function connect(){
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  const ws = new WebSocket(proto + location.host + "/ws");
  app.ws = ws;
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    handle(msg);
  };
  ws.onclose = () => {
    setConn(false);
    setStatus("连接已断开，正在重连…");
    const delay = Math.min(8000, 1000 * Math.pow(2, app.retry++));
    setTimeout(() => { if (app.ws === ws) connect(); }, delay);
  };
  ws.onerror = () => { try { ws.close(); } catch {} };
}
function setConn(on){
  app.connected = on;
  if (on) { app.retry = 0; $("conn-dot").className = "conn-dot"; $("conn-text").textContent = "已连接到桌面端"; }
  else { $("conn-dot").className = "conn-dot off"; $("conn-text").textContent = "连接已断开"; }
}
let statusTimer = null;
function setStatus(text){
  $("status").textContent = text;
  clearTimeout(statusTimer);
  if (text) statusTimer = setTimeout(() => { $("status").textContent = ""; }, 30000);
}
let toastTimer = null;
function toast(text){
  const el = $("toast"); el.textContent = text; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ================= 消息处理 ================= */
function handle(m){
  switch (m.type) {
    case "handshake":
      setConn(true);
      setStatus("");
      send({type:"list_workspaces", client_msg_id: uid()});
      send({type:"list_sessions", client_msg_id: uid()});
      if (app.current) openSession(app.current.session_id, app.current.workspace_id, true);
      break;
    case "workspaces":
      app.workspaces = new Map((m.workspaces || []).map(w => [w.id, w]));
      renderHome();
      break;
    case "sessions":
      app.sessions = (m.sessions || []).filter(s => !s.archived);
      renderHome();
      break;
    case "session_updated":
      if (m.session) {
        const i = app.sessions.findIndex(s => s.session_id === m.session.session_id);
        if (m.session.archived) {
          if (i >= 0) app.sessions.splice(i, 1);
        } else if (i >= 0) {
          app.sessions[i] = m.session;
        } else {
          app.sessions.unshift(m.session);
        }
        if (app.current && m.session.session_id === app.current.session_id) {
          Object.assign(app.current, m.session);
          $("ws-chip").textContent = app.current.title || "任务";
        }
        if (!app.current) renderHome();
      }
      break;
    case "session_snapshot":
      if (app.pendingSnapshot === m.session_id) {
        app.pendingSnapshot = null;
        renderTranscript(m.messages || []);
        applyPending(m);
        if (m.messages && m.messages.length) {
          $("view").scrollTop = $("view").scrollHeight;
        }
      }
      break;
    case "turn_started":
      app.running.add(m.session_id);
      app.errored.delete(m.session_id);
      app.waiting.delete(m.session_id);
      if (app.current && m.session_id === app.current.session_id) {
        setBusy(true);
        // 本端 Submit 时已即时渲染了用户行；引擎的 TurnStarted 只补上
        // 不是本端发出的那一行（排队自动排水、桌面端发的输入）。
        if (app.expectUser === (m.prompt || "")) {
          app.expectUser = null;
        } else {
          appendUser(m.prompt || "");
        }
      }
      break;
    case "text_delta":
      if (app.current && m.session_id === app.current.session_id) appendAssistantDelta(m.text || "");
      break;
    case "reasoning_delta":
      if (app.current && m.session_id === app.current.session_id) appendReasoningDelta(m.text || "");
      break;
    case "tool_started":
      if (app.current && m.session_id === app.current.session_id) {
        addTool(m.tool, "执行中…", m.tool_call_id);
      }
      break;
    case "tool_progress":
      if (app.current && m.session_id === app.current.session_id) updateTool(m.tool_call_id, m.progress || "");
      break;
    case "tool_result":
      if (app.current && m.session_id === app.current.session_id) finishTool(m.tool_call_id, m.result || "");
      break;
    case "tool_approval_requested":
      if (app.current && m.session_id === app.current.session_id) {
        showApproval(m);
      }
      app.waiting.add(m.session_id);
      break;
    case "approval_resolved":
      app.waiting.delete(m.session_id);
      if (app.current && m.session_id === app.current.session_id) hideCards();
      break;
    case "question_requested":
      app.waiting.add(m.session_id);
      if (app.current && m.session_id === app.current.session_id) showQuestion(m);
      break;
    case "question_resolved":
      app.waiting.delete(m.session_id);
      if (app.current && m.session_id === app.current.session_id) hideCards();
      break;
    case "completed":
    case "cancelled":
      app.running.delete(m.session_id);
      if (app.current && m.session_id === app.current.session_id) {
        setBusy(false); hideCards(); setStatus("");
        app.expectUser = null;
        closeAssistant(); closeReasoning();
        stampLastAssistant();
      }
      break;
    case "error":
      toast(m.message || "请求失败");
      setBusy(false);
      if (app.current) app.errored.add(app.current.session_id);
      break;
  }
}
/* 引擎把所有客户端的事件都广播到每个连接：只有本页自己刚点过
   「新建任务」时才跳进新会话，桌面端建的任务只刷新列表。 */
const origHandle = handle;
handle = function(m){
  if (m.type === "session_created") {
    if (app.expectCreate) {
      app.expectCreate = false;
      // 先补一条列表 stub，打开会话时标题才有据可依。
      app.sessions.unshift({
        session_id: m.session_id,
        workspace_id: m.workspace_id || null,
        title: "新任务",
        message_count: 0,
        archived: false,
      });
      openSession(m.session_id, m.workspace_id, false);
    } else {
      send({type:"list_sessions", client_msg_id: uid()});
    }
    return;
  }
  origHandle(m);
};
connect();

function relTime(ms){
  if (!ms) return "";
  const d = Date.now() - ms;
  if (d < 60e3) return "刚刚";
  if (d < 3600e3) return Math.floor(d / 60e3) + " 分钟";
  if (d < 86400e3) return Math.floor(d / 3600e3) + " 小时";
  const days = Math.floor(d / 86400e3);
  return days + " 天";
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;",
  }[c]));
}
function wsOf(id){ return app.workspaces.get(id); }
/* 官方四态 + 等待确认：运行中 > 等待确认 > 错误 > 空闲 */
function statusChip(sid){
  if (app.waiting.has(sid)) return '<span class="chip wait">等待确认</span>';
  if (app.running.has(sid)) return '<span class="chip running">运行中</span>';
  if (app.errored.has(sid)) return '<span class="chip error">错误</span>';
  return '<span class="chip idle">空闲</span>';
}
function sortSessions(rows){
  const key = app.sortBy === "created" ? "created_at_ms" : "updated_at_ms";

}
function taskRowHtml(s){

    '<div class="task-main">' +
      '<div class="task-title">' + esc(s.title || "未命名任务") + "</div>" +
      '<div class="task-meta">' + esc([meta, time].filter(Boolean).join(" · ")) + "</div>" +
    "</div>" +

/* ---- 超长文本的截断展开 ---- */
const MAX_TEXT = 20000;      // 单条消息渲染上限（base64 怪物防手机卡死）
const PAGE = 200;            // 时间线一次渲染的消息条数
let fullTranscript = [];
function truncate(text, key){
  if (text.length <= MAX_TEXT) return esc(text);
  const id = "tr-" + key;
  return '<span id="' + id + '">' + esc(text.slice(0, MAX_TEXT)) +
    '…<button class="copy" data-trunc="' + esc(key) + '">展开全文（' + Math.round(text.length/1000) + "K 字符）</button></span>";
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-trunc]");
  if (!b) return;
  const key = b.dataset.trunc;
  const item = fullTranscript[Number(key)];
  if (item) b.parentElement.outerHTML = esc(item.text);
});
/* ---- 时间线渲染（分段：只画最近 PAGE 条，早的给按钮） ---- */
function renderTranscript(messages){
  fullTranscript = messages;
  const view = $("view");
  const start = Math.max(0, messages.length - PAGE);
  let html = "";
  if (start > 0) {
    html += '<button class="load-earlier" id="load-earlier">加载更早的 ' + start + " 条消息</button>";
  }
  html += messages.slice(start).map((msg, i) => renderMessage(msg, start + i)).join("");
  if (!messages.length) {
    html += '<div class="empty">还没有消息。<br>在下方输入第一条指令。</div>';
  }
  // 空会话也保留 .doc 容器：后续 appendUser/appendAssistantDelta 都挂在它下面。
  view.innerHTML = '<div class="doc">' + html + "</div>";
  const le = $("load-earlier");
  if (le) le.addEventListener("click", () => {
    const doc = view.querySelector(".doc");
    const anchor = doc.firstElementChild;
    const next = Math.max(0, start - PAGE);
    let earlier = messages.slice(next, start).map((m, i) => renderMessage(m, next + i)).join("");
    le.remove();
    anchor.insertAdjacentHTML("beforebegin", earlier);
  });
  bindCopy();
}
function renderMessage(msg, idx){
  if (msg.role === "user") {
    return '<div class="msg-user"><div class="who"><span>你</span>' +
      '<button class="copy" data-copy="' + esc(idx) + '">复制</button></div>' +
      '<div class="body">' + truncate(msg.text || "", idx) + "</div></div>";
  }
  const time = "";
  return '<div class="msg-assistant" data-aidx="' + idx + '"><div class="body">' +
    (msg.role === "assistant" ? mdRender(msg.text || "") : '<div class="actions">' + esc(msg.text || "") + "</div>") +
    "</div>" + (msg.role === "assistant" ? '<div class="actions"><button class="copy" data-copy="' + esc(idx) + '">复制</button><span>' + time + "</span></div>" : "") +
    "</div>";
}
function bindCopy(){
  document.querySelectorAll("[data-copy]").forEach(b => {
    b.addEventListener("click", () => {
      const item = fullTranscript[Number(b.dataset.copy)];
      copyText(item ? item.text || "" : "");
    });
  });
}
function copyText(text){
  const done = () => toast("已复制");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch {}
  ta.remove();
}
/* ---- 轻量 markdown（标题/列表/代码/表格/粗斜体/链接/引用） ---- */
function inlineMd(s){
  return s
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(（])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdRender(src){
  if (src.length > MAX_TEXT) {
    return "<p>" + inlineMd(src.slice(0, MAX_TEXT)) + "…</p>";
  }
  const lines = src.split("\n");
  let html = "", inCode = false, codeBuf = [], listBuf = null, tableBuf = [];
  const flushList = () => {
    if (listBuf) { html += "<" + listBuf.tag + ">" + listBuf.items.join("") + "</" + listBuf.tag + ">"; listBuf = null; }
  };
  const flushTable = () => {
    if (tableBuf.length >= 2) {
      const cells = (row) => row.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(tableBuf[0]);
      const bodyRows = tableBuf.slice(2).map(cells);
      html += "<table><thead><tr>" + head.map(c => "<th>" + inlineMd(c) + "</th>").join("") +
        "</tr></thead><tbody>" + bodyRows.map(r => "<tr>" + r.map(c => "<td>" + inlineMd(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
    } else if (tableBuf.length) {
      html += tableBuf.map(l => "<p>" + inlineMd(l) + "</p>").join("");
    }
    tableBuf = [];
  };
  for (const raw of lines) {
    const line = raw;
    if (inCode) {
      if (/^```/.test(line)) { html += "<pre><code>" + esc(codeBuf.join("\n")) + "</code></pre>"; inCode = false; codeBuf = []; }
      else codeBuf.push(line);
      continue;
    }
    if (/^```/.test(line)) { flushList(); flushTable(); inCode = true; continue; }
    const t = line.trim();
    if (/^\|.*\|/.test(t)) { flushList(); tableBuf.push(t); continue; }
    flushTable();
    if (!t) { flushList(); continue; }
    const h = t.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushList(); html += "<h" + h[1].length + ">" + inlineMd(h[2]) + "</h" + h[1].length + ">"; continue; }
    if (/^([-*+])\s+/.test(t)) {
      if (!listBuf || listBuf.tag !== "ul") { flushList(); listBuf = {tag:"ul", items:[]}; }
      listBuf.items.push("<li>" + inlineMd(t.replace(/^([-*+])\s+/, "")) + "</li>"); continue;
    }
    if (/^\d+[.)]\s+/.test(t)) {
      if (!listBuf || listBuf.tag !== "ol") { flushList(); listBuf = {tag:"ol", items:[]}; }
      listBuf.items.push("<li>" + inlineMd(t.replace(/^\d+[.)]\s+/, "")) + "</li>"); continue;
    }
    if (/^>\s?/.test(t)) { flushList(); html += "<blockquote>" + inlineMd(t.replace(/^>\s?/, "")) + "</blockquote>"; continue; }
    if (/^(---+|\*\*\*+)$/.test(t)) { flushList(); html += "<hr>"; continue; }
    flushList();
    html += "<p>" + inlineMd(t) + "</p>";
  }
  if (inCode) html += "<pre><code>" + esc(codeBuf.join("\n")) + "</code></pre>";
  flushList(); flushTable();
  return html;
}

function ensureAssistant(){
  const doc = $("view").querySelector(".doc") || (() => {
    $("view").innerHTML = '<div class="doc"></div>';
    return $("view").querySelector(".doc");
  })();
  let el = doc.querySelector(".msg-assistant.pending:last-child");
  if (!el) {
    el = document.createElement("div");
    el.className = "msg-assistant pending";
    el.innerHTML = '<div class="body"></div>';
    doc.appendChild(el);
  }
  $("view").scrollTop = $("view").scrollHeight;
  return el;
}
function appendAssistantDelta(text){
  if (!text) return;
  const el = ensureAssistant();
  const body = el.querySelector(".body");
  body.dataset.raw = (body.dataset.raw || "") + text;
  if (!el._timer) {
    el._timer = setTimeout(() => {
      el._timer = null;
      // completed 已收尾的块不再重画（定时器可能晚于收尾触发）。
      if (!el.classList.contains("pending")) return;
      body.innerHTML = mdRender(body.dataset.raw || "");
      $("view").scrollTop = $("view").scrollHeight;
    }, 400);
  }
}
function closeAssistant(){
  const el = $("view").querySelector(".msg-assistant.pending:last-child");
  if (el) {
    // 先停掉未触发的防抖定时器，再以累计原文定稿；否则定时器会在
    // raw 清空后触发，把已渲染的内容擦掉。
    if (el._timer) { clearTimeout(el._timer); el._timer = null; }
    el.classList.remove("pending");
    const body = el.querySelector(".body");
    const raw = body.dataset.raw || "";
    if (raw) body.innerHTML = mdRender(raw);
    body.dataset.raw = "";
  }
}

    return !needle || c.label.toLowerCase().includes(needle) || c.hint.includes(needle);
  });
  if (ev.key === "ArrowDown") { ev.preventDefault(); paletteHot = Math.min(paletteHot + 1, items.length - 1); renderPalette($("palette-input").value); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); paletteHot = Math.max(paletteHot - 1, 0); renderPalette($("palette-input").value); }
  else if (ev.key === "Enter") {
    ev.preventDefault();

/* ================= 会话内查找（官方 quickPick.find） ================= */
let findMatches = [];   // {idx, start, len}
let findPos = 0;
function openFind(){
  if (!app.current) return;
  $("findbar").hidden = false;
  $("find-input").focus();
}
function closeFind(){
  $("findbar").hidden = true;
  $("find-input").value = "";
  $("find-count").textContent = "";
  findMatches = [];
  clearHighlights();
}
function clearHighlights(){
  document.querySelectorAll("#view mark").forEach(m => {
    const p = m.parentNode;
    p.replaceChild(document.createTextNode(m.textContent), m);
    p.normalize();
  });
}
function runFind(q){
  clearHighlights();
  findMatches = [];
  findPos = 0;
  const needle = q.trim().toLowerCase();
  if (!needle || !fullTranscript.length) { $("find-count").textContent = ""; return; }
  const doc = $("view").querySelector(".doc");
  if (!doc) return;
  fullTranscript.forEach((msg, idx) => {
    const text = (msg.text || "").toLowerCase();
    if (text.includes(needle)) findMatches.push({ idx, start: text.indexOf(needle) });
  });
  if (!findMatches.length) { $("find-count").textContent = "没有找到消息"; return; }
  // 逐条消息定位 DOM：把命中的消息滚动到视野并高亮第一处文本。
  const jump = () => {
    const hit = findMatches[findPos];
    $("find-count").textContent = (findPos + 1) + " / " + findMatches.length + " 条消息";
    const el = doc.querySelector('[data-aidx="' + hit.idx + '"], .msg-user:nth-of-type(1)');
    const target = [...doc.children].filter(c => c.classList.contains("msg-user") || c.classList.contains("msg-assistant"))[hit.idx];
    if (target) {
      target.scrollIntoView({ block: "center" });
      const body = target.querySelector(".body");
      if (body) {
        const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          const i = node.textContent.toLowerCase().indexOf(needle);
          if (i >= 0) {
            const range = document.createRange();
            range.setStart(node, i);
            range.setEnd(node, i + needle.length);
            const mark = document.createElement("mark");
            mark.className = "hot";
            try { range.surroundContents(mark); } catch {}
            break;
          }
        }
      }
    }
  };
  jump();
  $("find-next").onclick = () => { findPos = (findPos + 1) % findMatches.length; clearHighlights(); jump(); };
  $("find-prev").onclick = () => { findPos = (findPos - 1 + findMatches.length) % findMatches.length; clearHighlights(); jump(); };
}
$("find-close").addEventListener("click", closeFind);
