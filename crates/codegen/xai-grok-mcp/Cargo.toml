[package]
license = "Apache-2.0"
name = "xai-grok-mcp"
version = "0.1.0"
edition.workspace = true
description = "MCP integration crate. Quarantines rmcp + reqwest 0.13 (rmcp 3.x requires reqwest >= 0.13.2 while the rest of the workspace uses reqwest 0.12) and owns the MCP credential store and OAuth flow orchestrator."
authors = ["xAI"]

[dependencies]
rmcp = { version = "3.2", features = [
    "auth",
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
xai-grok-extra-ca = { workspace = true }
xai-grok-version = { workspace = true }
# reqwest 0.13 feature set for MCP transports. Notably:
# - `blocking` is for build-script style use (not actually used here today, but
#   kept for future MCP transports that may need it).
# - `query`/`form` opt-in features stay off; rmcp transports don't use them.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "stream",
] }

# Deps for credentials.rs + oauth.rs.
async-trait = { workspace = true }
axum = { workspace = true }
oauth2 = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
webbrowser = { workspace = true }
xai-grok-config = { workspace = true }

# For mcp_http_client.rs (rmcp trait signatures). Must match rmcp 3.x's own
# versions or the trait types won't unify.
http = { workspace = true }
sse-stream = "0.2"

# Deps for servers.rs.
agent-client-protocol = { workspace = true }
xai-grok-session-events = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
which = { workspace = true }
# Atomic descriptor writes (NamedTempFile + persist) in materialize_descriptors.
tempfile = { workspace = true }
# Child-network restriction on stdio server spawns; enforce is feature-unified
# from the binary crate, matching the other consumers.
xai-grok-sandbox = { path = "../xai-grok-sandbox", default-features = false }
xai-grok-tools = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-grok-workspace-types = { workspace = true }
xai-tool-protocol = { workspace = true }
xai-tool-runtime = { workspace = true }
xai-tool-types = { workspace = true }

# Wire-level MCP peer for `tests/real_mcp_server_e2e.rs`: a second OS process
# that really speaks JSON-RPC over stdio, so the test drives the shipped client
# instead of a mock inside the test process. `CARGO_BIN_EXE_mock-mcp-server`
# makes its path available to the integration test. Not a shipped binary.
[[bin]]
name = "mock-mcp-server"
path = "src/bin/mock-mcp-server.rs"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# `recv_wait::RecvBounded` bounds every test-side `recv()`, so a wait for an event that
# never arrives fails the test instead of running the CI job out to `timeout-minutes`.
xai-grok-test-support = { workspace = true }
# Serializes the integration tests that share the process-global $GROK_HOME.
serial_test = { workspace = true }
# Used in servers.rs test `test_same_raw_name_different_servers_no_local_registry_collision`
# to verify MCP tools register into a `LocalRegistry` without collision.
xai-computer-hub-sdk = { workspace = true }
# `test-util` enables `tokio::time::pause` / `advance`, required by
# the deterministic timing tests in `liveness.rs`.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
