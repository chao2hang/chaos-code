[package]
name = "chaos-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
dunce.workspace = true
reqwest.workspace = true
xai-grok-extra-ca = { workspace = true }
# The remote host verifies the artifact it is about to run; same ed25519 rules
# as the updater, which is why this is a leaf crate rather than a module of it.
xai-grok-signature = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "net", "io-util", "process", "time", "rt", "rt-multi-thread", "macros", "fs"] }
tracing.workspace = true
uuid.workspace = true
sha2.workspace = true
walkdir = "2"
rusqlite.workspace = true
xai-sqlite-journal = { path = "../xai-sqlite-journal" }
xai-grok-plugin-marketplace = { path = "../xai-grok-plugin-marketplace" }
xai-tty-utils = { path = "../xai-tty-utils" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The provenance tests have to hand the host a signed artifact, and the
# verify-only crate deliberately cannot sign; the key comes from here.
ed25519-dalek = { version = "2", features = ["rand_core"] }
# The port-forward tests carry a real WebSocket handshake through the tunnel, so
# they need something on both ends that speaks it, plus the traits that drive it.
tokio-tungstenite.workspace = true
futures-util.workspace = true
