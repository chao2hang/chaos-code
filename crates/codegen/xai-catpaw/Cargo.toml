[package]
name = "xai-catpaw"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Native CatPaw client core: protocol types, crypto, streaming, and encrypted account storage"
repository = "https://github.com/xai/grok-build"

[dependencies]
aes = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
eventsource-stream = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }
ring = { workspace = true }
rsa = { workspace = true, features = ["sha1", "pem", "getrandom"] }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
