[package]
name = "xai-catpaw"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Native CatPaw client core: protocol types, crypto, streaming, and encrypted account storage"
repository = "https://github.com/xai/grok-build"

[dependencies]
aes = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
eventsource-stream = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
parking_lot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }
ring = { workspace = true }
rqrr = { workspace = true }
rsa = { workspace = true, features = ["sha1", "pem", "getrandom"] }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
