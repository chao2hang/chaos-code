[package]
license = "Apache-2.0"
name = "xai-grok-update"
version = "0.1.220-alpha.4"
edition.workspace = true

[features]
# When enabled, `signature_required()` returns `true` by default, making the
# auto-updater refuse unsigned/tampered binaries. Disabled by default during
# the 0.3.x transition (env CHAOS_REQUIRE_SIG=1 still works to opt in).
# Enable in release builds by passing `--features require-sig` (or set it as
# default once all published releases carry .sig files). The switch itself
# lives in xai-grok-signature, so this only forwards.
default = []
require-sig = ["xai-grok-signature/require-sig"]

[dependencies]
dunce = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true }
xai-grok-extra-ca = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "process", "io-util", "macros", "time"] }
tracing = { workspace = true }
url = { workspace = true }
xai-dirs = { workspace = true }
xai-grok-shell = { workspace = true }
xai-grok-signature = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-grok-tools = { workspace = true }
xai-grok-version = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
# The integration test and the verify example sign things themselves, which the
# verify-only crate deliberately cannot do; the signing key comes from here.
ed25519-dalek = { version = "2", features = ["rand_core"] }
semver = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
# Locked process-environment writer, so env-mutating tests cannot race each
# other's `set_var`/`remove_var` (both are `unsafe` since edition 2024).
xai-grok-test-support = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }
