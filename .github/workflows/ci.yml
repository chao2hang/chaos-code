# Lightweight checks on main / PRs (not a full multi-platform release).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only supersede a pull request. Cancelling an in-flight main push throws
  # away the only full-run evidence for that commit: `platform-tests` has
  # `needs: rust` and starts last, so a rapid push sequence leaves it cancelled
  # and never produces a macOS/Windows result at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Compiles and tests the Rust workspace. Without this job, test-target
  # breakage is invisible: `release.yml` only runs `cargo build`, which does
  # not compile `#[cfg(test)]` code, so test code can drift out of sync with
  # production structs indefinitely.
  rust:
    name: rust check / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev ca-certificates ripgrep

      # apt's protobuf-compiler on ubuntu is too old for proto3 optional;
      # pin the same major as bin/protoc and release.yml.
      - name: Install dotslash
        run: |
          curl -fsSL https://github.com/facebook/dotslash/releases/download/v0.5.3/dotslash-linux-musl.x86_64.v0.5.3.tar.gz -o /tmp/dotslash.tar.gz
          tar -xzf /tmp/dotslash.tar.gz -C /tmp
          sudo install -m 0755 /tmp/dotslash /usr/local/bin/dotslash
      - name: Install protoc
        run: |
          bin/protoc --version

      # Single source of truth: `rust-toolchain.toml` pins the channel, and the
      # release build reads it too. Duplicating the number in `env` is what let
      # this file say 1.92.0 while the toml said 1.94.0, so CI and local builds
      # ran different compilers with nothing to notice.
      - name: Read pinned toolchain
        id: toolchain
        # This job is ubuntu-only, so the default shell would be bash anyway --
        # but say it out loud, because the release build matrix *is* Windows and
        # a copy of this step that forgot was what broke the first v0.4.0 tag.
        # `scripts/ci/check-workflow-shells.py` now enforces the habit.
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "no channel pinned in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: chaos-ci

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: ignored-test baseline
        run: |
          python3 scripts/ci/test-ignored-tests.py
          python3 scripts/ci/test-ignored-tests-baseline-fixture.py
          python3 scripts/ci/test-ignored-tests-baseline.py
          python3 scripts/ci/test-ignored-tests-reasons.py
          # CI runs this workflow without `--ignored`, so every skipped test is
          # invisible here. A reason string is what makes the skip auditable.
          python3 scripts/ci/ignored-tests.py --require-reasons
          python3 scripts/ci/ignored-tests.py --check-baseline scripts/ci/ignored-tests-baseline.tsv
      - name: brand and protocol guard
        run: |
          set -euo pipefail
          python3 scripts/ci/check-brand-protocol.py
          python3 scripts/ci/test-brand-protocol.py

      # --all-targets is the point of this step: it compiles tests, benches and
      # examples, which a plain `cargo check` skips.
      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets --locked

      # THIRD-PARTY-NOTICES is a legal artifact and it had drifted: 135 shipped packages had no
      # entry, 28 entries named a version no longer in the build, 191 described packages nothing
      # ships. None of that is visible in a diff, because the stale entry reads perfectly well and
      # the missing one is absent. Only comparing against what the build resolves can catch it, and
      # `cargo metadata --frozen` needs the registry, which is why this sits here -- after
      # `cargo check`, when the cache is warm -- rather than with the text-only gates below.
      # `scripts/ci/docker-entry-ci-only.tsv` records why the container does not run it.
      - name: third-party notices coverage
        run: |
          python3 scripts/ci/test-check-notices-coverage.py
          python3 scripts/ci/check-notices-coverage.py

      # The SBOM answers the other question -- not "what does this binary owe its users" but "what
      # is in it" -- and it is read by machines, so a wrong entry is worse than a missing one: a
      # scanner acts on it. Same dependency as the step above (`cargo metadata --frozen` needs a warm
      # registry, which is why this is not in the container), same shared reading of the graph, so
      # the two artifacts cannot disagree about what "shipped" means; `check-sbom.py` asserts they do
      # not, and the fixtures run the generator too rather than a hand-written document.
      - name: shipped SBOM
        run: |
          set -euo pipefail
          python3 scripts/ci/test-check-sbom.py
          python3 scripts/gen-sbom.py --output "$RUNNER_TEMP/chaos.cdx.json"
          python3 scripts/ci/check-sbom.py --sbom "$RUNNER_TEMP/chaos.cdx.json"
          # Twice, and byte for byte: the serial number is a fingerprint of the document, so this is
          # where CI learns that two runs of one tree still agree.
          python3 scripts/gen-sbom.py --output "$RUNNER_TEMP/again.cdx.json"
          cmp "$RUNNER_TEMP/chaos.cdx.json" "$RUNNER_TEMP/again.cdx.json"

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Cargo resolves features per build AND per target, so a dependency feature
      # that arrives through a target-gated dependency quietly vanishes on the
      # other targets -- same source, different dependency capabilities, no
      # compiler error. `serde_json/preserve_order` did exactly that: it reached
      # `xai-grok-tools` only through `nono`, which is `cfg(unix)`, so the MCP
      # elicitation schema-order test was green on Linux and reported
      # ["alpha", "zeta"] on the Windows leg. The two extra `rustup target add`
      # lines are the point: the guard fails rather than skip when a target in
      # scripts/ci/load-bearing-features.tsv is unavailable, so nothing here can
      # quietly degrade to a Linux-only comparison.
      - name: load-bearing dependency features
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
          python3 scripts/ci/test-check-load-bearing-features.py
          python3 scripts/ci/check-load-bearing-features.py

      # Scoped, not `--all-targets`. The workspace is now covered by
      # `cargo test --workspace`. Non-ignored tests are green. Tests that
      # don't apply to the Chaos fork (billing, subscription, gh-CLI mock,
      # connectors URL) are individually `#[ignore]`'d with reasons in-source.
      #
      # See docs/ci-test-debt.md for the historical ledger and the current
      # ignored-test inventory.
      #
      # 2026-08-13: All 7 previously-excluded crates were reintegrated after
      # per-crate audit and repair. Current ignored-test totals are maintained
      # in docs/ignored-audit-2026q4-summary.md and the baseline gate; do not
      # rely on the historical counts from the original reintegration audit.
      #
      # `check --all-targets` and `clippy` above still cover every crate, which
      # is what stops test code drifting out of sync with production structs.
      - name: cargo test
        env:
          # A handful of large xai-grok-shell actor tests exceed the default
          # 2 MiB test-thread stack; 16 MiB covers the current workspace suite.
          RUST_MIN_STACK: "16777216"
        run: |
          cargo test --workspace --locked --no-fail-fast

  # Platform-specific code paths (`xai-tty-utils` handle duplication, the
  # sandbox's Linux seccomp/namespaces vs Windows Job Object, the updater's
  # per-OS installer hint, PTY teardown) only compile on their target OS, so a
  # Linux-only job cannot claim they work. `release.yml` already runs on
  # macos-14 and windows-latest; this job runs the same crates' tests there.
  platform-tests:
    name: platform tests (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    # 45 was a guess made when the leg was written (da5e1ee0) and it was never
    # enough for Windows: on f585f59d the macos-14 job finished in 31m17s while
    # windows-latest burned its whole budget inside `cargo test` (steps 1-8 all
    # green, step 9 cancelled at 45m15s), which reports as a *cancelled* run
    # whose log names no failing test. A leg that always dies at the cap produces
    # no platform evidence at all, which is the failure this job exists to prevent.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The PowerShell installer is a documented entry point that no Linux job
      # can exercise, and a stray closing brace -- left behind when the signature
      # block was restructured in 21f5a186 -- made `irm .../install.ps1 | iex`
      # fail to parse for every Windows user until it turned up here. Parsing
      # costs a second, so it runs before the toolchain is even installed.
      - name: Parse the PowerShell installers
        shell: bash
        run: |
          set -euo pipefail
          # bash here, PowerShell inside: the checker finds `pwsh` itself, and pinning
          # bash keeps this step from depending on which shell GitHub would have picked.
          py="$(command -v python3 || command -v python || true)"
          test -n "$py" || { echo "::error::no python on PATH" >&2; exit 1; }
          "$py" scripts/ci/check-powershell-syntax.py --require
          # `--require` here, not on the ubuntu job: this is the pair of legs where a
          # missing PowerShell must stop the build rather than downgrade the asset-name
          # check to reading string literals out of install.ps1.
          "$py" scripts/ci/test-installer-asset-names.py --require
          # Which bash the check above chooses is a Windows-specific decision, so its
          # rules are asserted here as well as on the Linux job.
          "$py" scripts/ci/test-installer-bash-resolution.py

      # Same protoc the Linux and release jobs use; apt's version is too old
      # for proto3 optional and the macos/windows images ship none.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "no channel pinned in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: chaos-platform
          key: ${{ matrix.os }}

      # Debug builds do not embed ripgrep (build.rs bundles it for release only),
      # so the search tools resolve `rg` on the host. Neither runner image ships
      # ripgrep, and every grep/glob test then died at spawn with "No such file
      # or directory". Fetch the same pinned release the release build embeds and
      # point RG_BIN_PATH at it, so these legs exercise the real search tools.
      - name: Provide ripgrep for the search tools
        shell: bash
        run: |
          set -euo pipefail
          rg_ver="15.0.0"
          case "$RUNNER_OS" in
            macOS)
              rg_triple="aarch64-apple-darwin"
              rg_binary="rg"
              ;;
            Windows)
              rg_triple="x86_64-pc-windows-msvc"
              rg_binary="rg.exe"
              ;;
            *)
              rg_triple="x86_64-unknown-linux-musl"
              rg_binary="rg"
              ;;
          esac
          if command -v cygpath >/dev/null 2>&1; then
            tools_dir="$(cygpath -u "${RUNNER_TEMP:-/tmp}")/ripgrep-$rg_ver"
          else
            tools_dir="${TMPDIR:-/tmp}/ripgrep-$rg_ver"
          fi
          mkdir -p "$tools_dir"
          case "$RUNNER_OS" in
            Windows)
              curl -fsSL -o "$tools_dir/ripgrep.zip" \
                "https://github.com/BurntSushi/ripgrep/releases/download/$rg_ver/ripgrep-$rg_ver-$rg_triple.zip"
              # Git Bash ships GNU tar, which cannot read a zip; Expand-Archive
              # is present on every Windows runner.
              ( cd "$tools_dir" && powershell.exe -NoProfile -Command \
                  "Expand-Archive -LiteralPath ripgrep.zip -DestinationPath ." )
              # The zip holds everything under `ripgrep-<ver>-<triple>/`, which is
              # what --strip-components=1 flattens on the other legs. Git Bash `mv`
              # does the same here, so `RG_BIN_PATH` names one file either way.
              mv "$tools_dir/ripgrep-$rg_ver-$rg_triple/$rg_binary" "$tools_dir/$rg_binary"
              ;;
            *)
              curl -fsSL -o "$tools_dir/ripgrep.tar.gz" \
                "https://github.com/BurntSushi/ripgrep/releases/download/$rg_ver/ripgrep-$rg_ver-$rg_triple.tar.gz"
              tar -xzf "$tools_dir/ripgrep.tar.gz" -C "$tools_dir" --strip-components=1 \
                "ripgrep-$rg_ver-$rg_triple/$rg_binary"
              ;;
          esac
          # A missing binary here would otherwise surface as an exit 127 from the
          # version line below, which says nothing about the archive layout.
          if [ ! -f "$tools_dir/$rg_binary" ]; then
            echo "$rg_binary is not where this step assumes the archive puts it:" >&2
            find "$tools_dir" -maxdepth 3 -type f | head -20 >&2
            exit 1
          fi
          chmod +x "$tools_dir/$rg_binary" 2>/dev/null || true
          "$tools_dir/$rg_binary" --version | head -1
          if command -v cygpath >/dev/null 2>&1; then
            echo "RG_BIN_PATH=$(cygpath -w "$tools_dir/$rg_binary")" >> "$GITHUB_ENV"
          else
            echo "RG_BIN_PATH=$tools_dir/$rg_binary" >> "$GITHUB_ENV"
          fi

      # Split in two, on the Windows job log rather than on a hunch. On f585f59d
      # one step ran all six crates: the compile took 25m43s (23:48:37 -> the
      # first `test result:` at 00:14:20), five test binaries finished inside
      # four seconds, and `xai_grok_tools-c0c13642df1bb12b.exe` -- 3087 tests --
      # then printed its last completed test at 00:15:59 and went silent for
      # 16m43s until the job cap cancelled it. A cap that fires mid-binary erases
      # the verdict of every crate in the step, so the five healthy legs were
      # reported as nothing but "cancelled". Per-step caps mean a hang in one
      # crate can only cost that crate its own verdict. `if: always()` because a
      # step that failed or timed out must not hide the other answer.
      - name: "cargo test (target-OS crates: except xai-grok-tools)"
        timeout-minutes: 35
        shell: bash
        env:
          # Same 16 MiB test-thread stack the Linux job needs.
          RUST_MIN_STACK: "16777216"
        run: |
          set -euo pipefail
          cargo test --locked --no-fail-fast \
            -p xai-tty-utils \
            -p xai-grok-sandbox \
            -p xai-grok-shell-terminal \
            -p xai-grok-update \
            -p xai-grok-pager-bin

      - name: "cargo test (target-OS crates: xai-grok-tools)"
        timeout-minutes: 35
        if: always()
        shell: bash
        env:
          RUST_MIN_STACK: "16777216"
        run: |
          set -euo pipefail
          cargo test --locked --no-fail-fast -p xai-grok-tools

      # Job logs need repository admin rights, but check-run annotations are
      # public. Reporting which tools actually landed on PATH is enough to tell
      # a broken setup step from a broken test run without log access.
      - name: Report failure environment
        if: failure()
        shell: bash
        run: |
          set +u
          echo "::error::os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          for tool in rustc cargo rustup protoc; do
            echo "::error::${tool}: $(command -v "${tool}" || echo 'not on PATH')"
          done
          echo "::error::rustc: $(rustc -V 2>&1 | head -1)"
          echo "::error::cargo: $(cargo -V 2>&1 | head -1)"
          echo "::error::protoc: $(protoc --version 2>&1 | head -1)"

  # Local hooks are opt-in per clone (scripts/install-hooks.sh), so this job is
  # what actually enforces the rule. e9d8fa9 pushed 24 environment dumps with
  # live API keys to the public remote; nothing in CI would have noticed.
  # Both installers refuse a bad release, and both prove it against a release this
  # repository built itself -- `install.sh` in a container with `--network none`,
  # `install.ps1` under pwsh inside a network namespace whose only route is loopback.
  # Neither had run anywhere but the machine that wrote them, and a lab nobody else
  # executes is indistinguishable from a check that was deleted. This job runs both
  # on every push. It needs no network at run time, no release and no signing key:
  # the fixture generates its own key pair and signs its own artifact, and the two
  # labs deliberately share that fixture so the installers cannot be tested against
  # two different releases.
  installer-integrity:
    name: installer integrity labs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The fixture signs with Ed25519 through python3-cryptography, which the runner
      # image does not carry. apt rather than pip: the Ubuntu 24.04 image marks its
      # interpreter externally managed, and the lab wants the same distro build a
      # Debian user would have anyway. Neither lab has a skip path -- a missing
      # `pwsh`, a missing crypto binding, or a machine that will not create a network
      # namespace by either route exits 2 with a named reason, so the job cannot go
      # green by absence.
      - name: Install the crypto binding the fixture signs with
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-cryptography
          python3 -c 'import cryptography; print("cryptography", cryptography.__version__)'
          # Recorded here rather than left to the lab, so a runner-image change shows up
          # at once instead of three minutes into the docker step.
          pwsh --version
          # Which namespace route this runner allows, printed and not asserted. These
          # images refuse unprivileged user namespaces (`unshare -rn` fails writing
          # /proc/self/uid_map) while root can still create one, and asserting the
          # unprivileged route in this step is what used to take the container lab down
          # with it: the PowerShell lab resolves its own route and exits 2 if there is
          # none, which is where that verdict belongs.
          if unshare -rn true 2>/dev/null; then
            echo "namespace route: unprivileged unshare -rn"
          elif sudo -n unshare -n true 2>/dev/null; then
            echo "namespace route: root unshare -n (unprivileged user namespaces are off)"
          else
            echo "namespace route: none -- the PowerShell lab will refuse to run"
          fi

      - name: install.sh refuses a bad release (container, no network)
        run: ./scripts/install-integrity-in-docker.sh

      - name: install.ps1 refuses a bad release (pwsh, loopback-only namespace)
        run: ./scripts/install-integrity-powershell.sh

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan tracked files
        run: ./scripts/ci/secret-scan.sh

  # The user guide, the reference docs and the tutorials are compiled into the
  # binary (`pager/src/docs.rs`) and unpacked to `~/.chaos/docs/`, so all of it
  # is user-visible text. `scripts/check-doc-l10n.py` has always been able to
  # check it, but its default glob is `docs/user-guide/*.md` and nothing ever
  # ran it against the rest -- so `docs/custom-hooks.md` and
  # `docs/hooks-and-plugins.md` went unchecked, and two cross-document anchors
  # rotted there for a whole translation round: the *link* lived in a file no
  # check read, pointing at a heading a translation had renamed. This job is
  # that missing reader. It uses only the worktree modes (no `--before`), since
  # those are the ones that are meaningful on a single checkout; the
  # `--before/--after` invariants are a translation-time tool for comparing
  # adjacent commits.
  docs-l10n:
    name: docs localization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `l10n-guard.sh` compares the two sides of a docs rename by counting Han
      # characters, and it has no fallback for that: without `rg` it prints
      # `l10n-guard: rg (ripgrep) not found` and 16 of its 17 self-test cases
      # fail. The runner image does not ship ripgrep, while the Docker entry
      # installs it -- so every push red on this job and green locally, which is
      # how the failure was read as a docs problem rather than a missing package.
      - name: Install ripgrep
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      - name: user guide, reference docs and tutorials
        run: |
          set -euo pipefail
          glob='crates/codegen/xai-grok-pager/docs/**/*.md'
          # No English prose left untranslated. This mode skips table rows on
          # purpose; `--cells` is the other half.
          python3 scripts/check-doc-l10n.py --english --glob "$glob"
          # No upstream-only `grok <cmd>` command name or `~/.grok` config path.
          python3 scripts/check-doc-l10n.py --fork-names --strict --glob "$glob"
          # Every `](file.md#anchor)` resolves. Translating a heading renames its
          # anchor, so an inbound link has to be rewritten in the same commit --
          # this is what catches it when it is not.
          python3 scripts/check-doc-l10n.py --links --glob "$glob"
          # Every table cell is either translated or a decided literal.
          python3 scripts/check-doc-l10n.py --cells --strict --glob "$glob"

      # Both localization guards are only as good as the day somebody checked
      # that they still fail on purpose. `check-doc-l10n-selftest.py` existed but
      # nothing invoked it -- so a check whose assertions had quietly stopped
      # biting would have stayed green unnoticed -- and `l10n-guard.sh` needs
      # its own, because its pass/fail call now depends on classifying a
      # disappeared file as a move, a recorded removal, or a real loss. The last
      # command runs the source-file guard over the real checkout, which is what
      # catches a construct that parses on Linux CI but dies on bash 3.2.
      - name: guard self-tests
        run: |
          set -euo pipefail
          python3 scripts/l10n-guard-selftest.py
          python3 scripts/check-doc-l10n-selftest.py
          bash scripts/l10n-guard.sh --before HEAD --after HEAD --report "$RUNNER_TEMP/l10n"

      # The TODO status document tells its reader to "recompute after the next
      # edit" and then sat 13 rows off -- 149 claimed against 136 real, with one
      # row reading 24/3 while the prose in the same file said 5/13 -- because
      # that instruction was only ever followed by hand. `--check-doc` is the
      # same comparison made into an exit code, and the fixtures prove it still
      # fails on a transposed column, a missing row and a non-numeric count.
      # `--check-export` covers the row-level export beside it: dated once, that
      # file went stale the first time TODO.md moved afterwards and stayed stale.
      - name: TODO status document matches TODO.md
        run: |
          set -euo pipefail
          python3 scripts/ci/test-classify-open-todos.py
          python3 scripts/ci/classify-open-todos.py --check-doc docs/architecture/todo-open-item-classification.md
          python3 scripts/ci/classify-open-todos.py --check-export
      # 40 pointers across 8 committed documents told their reader to open an
      # evidence log "in the private goal scratch" -- a per-session temporary
      # directory deleted when the session that wrote it ends. Nothing failed,
      # because nothing looked, so the claim of evidence was unverifiable by
      # anyone but the session that made it. This refuses that wording in
      # Markdown and in the generated TODO export; captured transcripts are
      # left alone because they quote the command line that actually ran.
      - name: Committed docs do not cite scratch paths
        run: |
          set -euo pipefail
          python3 scripts/ci/test-check-evidence-paths.py
          python3 scripts/ci/check-evidence-paths.py

      # A naive "does this string look like a path and does it exist" scan of
      # the docs found 3,919 hits across 2,266 tokens, all of them junk (`I/O`,
      # `go/no-go`, `session/new`, `upstream/main`). That ratio is why path
      # rot is never checked. Restricting the scan to `[text](target)` links and
      # to code spans whose entire content is one path, and requiring the first
      # segment to be a tracked top-level entry, brings it to a list a human can
      # read: 3 broken links and 39 dangling mentions. Three of the links were
      # real -- a doc skill pointing four levels up out of the repository, a
      # vendored-notice block for a crate that was never vendored, and a build.rs
      # that moved crates two years of commits ago -- and all three were fixed.
      # The remaining 39 are recorded with a reason in the allowlist, which the
      # check also proves still dangles.
      - name: Docs path references resolve or are recorded
        run: |
          set -euo pipefail
          python3 scripts/ci/test-check-doc-path-refs.py
          python3 scripts/ci/check-doc-path-refs.py

      # Both gates above read prose and both refuse to read a captured transcript,
      # which leaves the one thing a maintainer pastes unchecked: the command line.
      # Two findings on 2026-10-04: a reproduction section told the reader to run
      # `python3 scripts/ci/check-gui-protocol.sh`, a bash script, while the same
      # file ran it with `bash` 140 lines earlier; and the same class of mistake had
      # already produced a false measurement, because `python3` on a `.sh` raises and
      # the exit code the loop looked at came from `tail`. This reads the `$ ` lines in
      # `docs/verification/*.log` and every command line in the docs, refuses an
      # interpreter handed another interpreter's script, and refuses a path the
      # command is supposed to read that is no longer in the tree.
      - name: Documented commands can actually be run
        run: |
          set -euo pipefail
          python3 scripts/ci/test-check-evidence-commands.py
          python3 scripts/ci/check-evidence-commands.py

  gui:
    name: GUI engine, Web host and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dotslash
        run: |
          curl -fsSL https://github.com/facebook/dotslash/releases/download/v0.5.3/dotslash-linux-musl.x86_64.v0.5.3.tar.gz -o /tmp/dotslash.tar.gz
          tar -xzf /tmp/dotslash.tar.gz -C /tmp
          sudo install -m 0755 /tmp/dotslash /usr/local/bin/dotslash
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^" ]*\)".*/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/chaos-ui/package-lock.json
      - name: Rust GUI checks
        run: cargo test -p chaos-engine -p xai-grok-web -p xai-grok-desktop --locked
      - name: Protocol type drift
        run: ./scripts/ci/check-gui-protocol.sh
      - name: Protocol mirror coverage
        run: |
          set -euo pipefail
          # `Protocol type drift` above compares the committed protocol.ts with a
          # string constant, so both sides are the same hand-written text: it
          # cannot see a message added to ClientMessage/ServerMessage and never
          # mirrored. Six attachment messages lived that way -- spoken by the
          # engine, covered by Rust tests, invisible to the browser. This parses
          # the real enums and checks tags and field names in both directions.
          python3 scripts/ci/test-check-protocol-mirror.py
          python3 scripts/ci/check-protocol-mirror.py
      - name: Frontend checks
        working-directory: apps/chaos-ui
        run: npm ci --ignore-scripts && npm run typecheck && npm test && npm run build

  gui-browser-e2e:
    name: GUI browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install dotslash
        run: |
          curl -fsSL https://github.com/facebook/dotslash/releases/download/v0.5.3/dotslash-linux-musl.x86_64.v0.5.3.tar.gz -o /tmp/dotslash.tar.gz
          tar -xzf /tmp/dotslash.tar.gz -C /tmp
          sudo install -m 0755 /tmp/dotslash /usr/local/bin/dotslash
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^" ]*\)".*/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/chaos-ui/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/chaos-ui
        run: npm ci --ignore-scripts
      - name: Build frontend assets
        # Three specs feed apps/chaos-ui/dist to a chaos-web they spawn
        # themselves (static-host.pw.ts copies it into a temp dir,
        # reconnect-snapshot.pw.ts and commit-message-safe-mode.pw.ts point
        # CHAOS_WEB_ASSETS_DIR at it), so the built bundle is test input. This
        # job is separate from the `gui` job, so nothing else produces it here.
        working-directory: apps/chaos-ui
        run: npm run build
      - name: Build Web host before browser test
        run: cargo build --locked -p xai-grok-web --bin chaos-web
      - name: Install Chromium
        working-directory: apps/chaos-ui
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: apps/chaos-ui
        env:
          CI: true
        run: npm run test:e2e

  npm-scripts:
    name: npm package scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: postinstall unit tests
        working-directory: crates/codegen/xai-grok-pager/npm/chaos
        run: node scripts/test-postinstall.js

      # MT-1: `release.yml` resolves the release version from npm and injects it
      # into the Rust build, while the Rust side falls back to
      # `CARGO_PKG_VERSION`. Nothing compared the two, so a one-sided bump would
      # ship a `chaos --version` that disagrees with the package that installed it.
      - name: version consistency (Cargo vs npm)
        run: |
          python3 scripts/ci/test-check-versions.py
          ./scripts/ci/check-versions.sh

      - name: installer signature policy
        run: python3 scripts/ci/test-installer-signature-policy.py

      # install.sh refuses a truncated body, an HTML proxy page and a short mirror
      # response, then moves to the next candidate and prints one reason per distinct
      # failure. The size probe used to end the script instead of skipping a candidate,
      # so the report nobody saw was the one that named the reason. Fixtures, against a
      # local endpoint: no release artifact is fetched here.
      - name: installer download size floor
        run: python3 scripts/ci/test-installer-download-size.py

      # A stalled mirror is the other half of the same hole: the binary is fetched with no
      # --max-time, because any cap short enough to help a bad line would also kill a good
      # one, so a mirror that trickles bytes was waited on forever. The fixtures pace a
      # local endpoint rather than fetch anything, and one of them proves a transfer slower
      # than the window still lands -- that is why this is a rate floor and not a timeout.
      - name: installer download stall floor
        run: python3 scripts/ci/test-installer-download-stall.py

      - name: stamp-version dry run
        run: |
          set -euo pipefail
          node scripts/ci/stamp-npm-version.mjs 0.0.0-ci
          # restore so the job workspace stays clean for later steps
          git checkout -- crates/codegen/xai-grok-pager/npm || true

      - name: assemble script syntax (node -c via load)
        run: |
          node --check crates/codegen/xai-grok-pager/npm/chaos/scripts/assemble-platform-packages.js
          node --check crates/codegen/xai-grok-pager/npm/chaos/bin/postinstall.js
          node --check crates/codegen/xai-grok-pager/npm/chaos/bin/install-lib.js
          node --check crates/codegen/xai-grok-pager/npm/chaos/bin/chaos-bootstrap.js
          node --check crates/codegen/xai-grok-pager/npm/chaos/bin/chaos

      - name: publish-npm.sh guards
        run: bash scripts/ci/test-publish-npm.sh

      # Every published package has to carry the third-party notices. `files` in seven manifests
      # says it, the assembler writes eight copies of the bundle, and publish refuses a directory
      # without one -- three places making one promise, which is exactly the shape that rots. These
      # fixtures drive the real assembler and a real `npm pack --dry-run`, so a bundle that stops
      # being written fails here instead of in the tarball someone installs.
      - name: notices bundle assembly guards
        run: bash scripts/ci/test-assemble-notices.sh

      # Each published package carries `bin/integrity.json`, and the installer and the launcher
      # refuse bytes that do not hash to it. These fixtures run the real assembler over six fake
      # binaries, then drive the real `postinstall.js`, the real `bin/chaos` and the real Windows
      # copy path against the packages it produced -- including a truncated install being repaired
      # from the package and a tampered archive refusing both entry points.
      - name: npm integrity record guards
        run: bash scripts/ci/test-assemble-integrity.sh

      # The digest guard is the last thing standing between a corrupted archive and a user's
      # machine, so its own fixtures refuse 39 forgeries of the record and of the tree it reads.
      # Without this the guard could silently stop noticing a tampered archive and every check
      # above would still be green, because they all ask the guard whether the tree is fine.
      - name: npm integrity guard fixtures
        run: python3 scripts/ci/test-check-npm-integrity.py

      # Nothing is assembled in a normal checkout, so this is a shape check on the tree: a stale
      # archive or a half-written record left in a working tree would otherwise be published by a
      # release that assembled around it.
      - name: npm integrity records in the tree
        run: python3 scripts/ci/check-npm-integrity.py

  workflows-present:
    name: workflows present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require release + ci workflows
        run: |
          test -f .github/workflows/release.yml
          test -f .github/workflows/ci.yml
          # basic structure checks
          grep -q 'name: Release' .github/workflows/release.yml
          grep -q 'xai-grok-pager-bin' .github/workflows/release.yml
          grep -q 'chaos-code' crates/codegen/xai-grok-pager/npm/chaos/package.json
          # The docs-localization job is the only reader of the reference docs
          # and tutorials; losing it would be silent, which is the same reason
          # this step exists at all.
          grep -q 'docs-l10n' .github/workflows/ci.yml
          # Same reasoning for the two installer gates added on 2026-10-02. Both are
          # slow enough that deleting them would look like an improvement, and both
          # guard code that only gets exercised by a user with a bad download -- i.e.
          # never, during development.
          grep -q 'installer-integrity' .github/workflows/ci.yml
          grep -q 'test-installer-asset-names.py' .github/workflows/ci.yml
          # Every `run:` step in a Windows-capable job must pin `shell: bash`
          # (or opt out with an `if: runner.os` guard). This job is ubuntu-only,
          # so nothing here can catch such a mistake the way the release matrix
          # does -- and by then the tag is already public. The first v0.4.0 tag
          # failed exactly this way, on two of six builds.
          # The fixtures are the part that keeps this a rule rather than a habit:
          # they hand the checker a Windows job with an unpinned `run:` in three
          # matrix spellings and ask whether it says so, and they are what prove
          # the checker still reads a block-form `os:` list as a matrix.
          python3 scripts/ci/test-check-workflow-shells.py
          python3 scripts/ci/check-workflow-shells.py
          # A step's `run:` block may only use a binary the job actually
          # provisions. This is the rule the `docs localization` job broke on
          # 2026-10-02: its guard needs ripgrep, no step installed it, and the
          # job stayed red on every push while every local gate was green.
          # `scripts/ci/test-check-workflow-toolchain.py` pins what counts as a
          # need and what counts as provisioning one.
          python3 scripts/ci/test-check-workflow-toolchain.py
          python3 scripts/ci/check-workflow-toolchain.py
          # A workflow file GitHub cannot parse runs no jobs at all: the push looks
          # untested rather than broken, and every guard in the file stops existing for
          # it. Both checks above walk the file by line and both said OK to a step name
          # carrying `crates: xai-grok-tools`, which YAML reads as a mapping separator.
          # This is the parser-shaped check they are not, and its fixtures cross-check
          # every verdict against a real YAML parser when one is installed.
          python3 scripts/ci/test-check-workflow-yaml.py
          python3 scripts/ci/check-workflow-yaml.py
          # Every `scripts/**.sh` has to run on the stock macOS shell too, not
          # just the Linux runner this job executes on: `scripts/test-platform.sh`
          # is the documented macOS entry point. bash 3.2 + BSD userland has no
          # `mapfile`, `${var^^}` or GNU `sed -i`, and the failure there is a
          # bare "command not found" on a contributor's machine.
          python3 scripts/ci/check-script-portability.py
          python3 scripts/ci/test-script-portability.py
          # The other way a shell script in this repo can be wrong without saying so. In a
          # `set -e` script a plain `name="$(pipeline)"` assignment inherits the pipeline's
          # status, so a stage that exits non-zero for an ordinary answer -- `grep` matching
          # nothing, `diff` finding a difference, `wc` handed a file that is not there -- ends
          # the script at the assignment. Three shipped scripts did exactly that on 2026-10-04:
          # each exited with the right code and printed nothing, because the code that prints
          # sat one statement later. Scripts running `set -uo pipefail` without `-e` are out of
          # scope, and scripts/verify-gates.sh is one of them on purpose.
          python3 scripts/ci/test-check-pipefail-report.py
          python3 scripts/ci/check-pipefail-report.py
          # The container entry point mounts the working tree at /src and runs its gates as
          # root, so a file the container creates is root's inside the developer's checkout.
          # A gate run on 2026-10-04 left a Python bytecode cache there and a full run left two;
          # where the cache directory did not exist yet, `rm -rf` over that tree stopped working.
          # The check judges which script mounts the checkout, not which script is named like a
          # container entry point, and covers the image too so `--shell` behaves the same.
          python3 scripts/ci/test-check-container-hygiene.py
          python3 scripts/ci/check-container-hygiene.py
          # The runtime half of that rule. The check above reads shell text, so a mount path put
          # together at runtime is outside its reach; this one walks the checkout and compares the
          # owner of every path against the owner of the checkout itself. Build output is skipped by
          # name, because in the container that name is the mount point of the cargo volume and what
          # sits there is legitimately root-owned.
          python3 scripts/ci/test-check-tree-ownership.py
          python3 scripts/ci/check-tree-ownership.py
          # The other end of the container entry point. `scripts/verify-in-docker.sh` owns the gate
          # list that every step in this job mirrors, and its own behaviour had been exercised only
          # by hand against a real image. These fixtures drive the shipped script with a stub
          # `docker` on PATH and assert against every invocation it records: `--only` reaching
          # exactly one gate, a failed preflight running nothing, a filtered run refusing the sweep
          # wording, the UNATTRIBUTABLE path still printing a verdict, and each gate run carrying
          # the `--env` entries this file's own steps had to discover the hard way.
          python3 scripts/ci/test-verify-in-docker.py
          # Two ratchets over the Rust sources, both from one scanner. The first
          # refuses a crate that gains a production `.unwrap()`, `.expect()`,
          # `panic!` or `unsafe` site; the definition of "production" it uses
          # (reachability from a crate root, minus `cfg(test)` spans) is pinned by
          # scripts/ci/test-panic-site-census.py. The second refuses a `.rs` file
          # that no crate root reaches, which is how `/adhd` vanished from a
          # released build: an undeclared module is not an error to the compiler.
          python3 scripts/ci/test-panic-site-census.py
          python3 scripts/ci/panic-site-census.py --check-baseline scripts/ci/panic-site-baseline.tsv
          python3 scripts/ci/panic-site-census.py --check-uncompiled scripts/ci/uncompiled-sources.txt
          # The census above counts panic sites by the tokens that cause them, so it cannot
          # see a Prometheus metric call whose label count is wrong: `with_label_values`
          # unwraps inside the dependency (`prometheus-0.14.0/src/vec.rs:292`) and fails on a
          # count mismatch (`src/vec.rs:114`), while `&[&str]` of any length typechecks. The
          # abort lands on a startup, drain or error path no test runs. This checks every
          # label-value call against the labels its metric declares, and every registered
          # name and label against what Prometheus accepts, which is also what makes the
          # `.unwrap()` on the 82 registrations unreachable rather than merely unlikely.
          python3 scripts/ci/test-check-metric-labels.py
          python3 scripts/ci/check-metric-labels.py
          # tokio spawns the child inside `.output()` / `.status()` themselves and leaves it
          # running once the future is dropped (tokio-1.52.3/src/process/mod.rs:202, :641), so
          # `timeout(budget, cmd.output())` cancels the waiting and not the work. The clippy
          # spawn ban cannot reach this shape -- `ProcessScope::enroll` takes a `&Child` that
          # `.output()` never hands back -- and 10 of the 12 sites on this tree were already
          # marked while 2 were not, with nothing distinguishing the two groups.
          python3 scripts/ci/test-check-timeout-child.py
          python3 scripts/ci/check-timeout-child.py
          # A test that changes the process working directory and leaves it inside a
          # directory something else deletes breaks every sibling in the same libtest
          # process: gix_discover::is_git calls current_dir() before it looks at the
          # path it was given, so after that, every gix::open in the process fails.
          # The poisoned test is never the guilty one, so the shape has to be caught
          # statically -- see scripts/ci/test-cwd-change-census.py for the dodges.
          python3 scripts/ci/test-cwd-change-census.py
          python3 scripts/ci/cwd-change-census.py --check-baseline scripts/ci/cwd-change-baseline.tsv
          # A working directory handed to the OS has to exist on the host running the
          # test. The macos/windows legs found out the expensive way: one fixture line
          # (`working_directory: PathBuf::from("/tmp")`) lost 54 tests at once on
          # windows-latest, after 26 minutes of build, and the run reported only
          # "cancelled". The crate list is read from the platform step below, so this
          # gate cannot drift away from the legs it protects.
          python3 scripts/ci/test-check-spawn-cwd-portability.py
          python3 scripts/ci/check-spawn-cwd-portability.py
          # Every `#[cfg(unix)]` on a test deletes it from another platform's build: it is not
          # "skipped", so no runner counts it and no green leg mentions it. The ledger is what
          # stops a red platform leg being made green by adding a gate, and it also names the
          # gated tests whose body contains no platform assumption at all. The four numbers are
          # today's measured debt and can only move down.
          python3 scripts/ci/test-platform-gated-tests.py
          python3 scripts/ci/platform-gated-tests.py --quiet \
            --check-baseline scripts/ci/platform-gated-tests.tsv \
            --max-unreviewed 1106 --max-blind-windows 74 --max-blind-macos 11 \
            --max-assumption-free 427
          # Four consumers derive a release asset name -- install.sh, install.ps1,
          # install.bat and the auto-updater -- and one workflow publishes it. A rename
          # on the publisher's side is invisible to all four until an install or an
          # upgrade 404s, which reads as "no such version". This compares the four
          # against the `copy_one` lines, executing the two that can run here.
          python3 scripts/ci/test-installer-asset-names.py
          # Which bash that check executes install.sh through is itself a decision with
          # rules: $BASH beats PATH, Git for Windows beats PATH, and anything under
          # System32 (the WSL launcher) is not a bash. Fixtures, because no Linux host
          # has a WSL launcher to be fooled by.
          python3 scripts/ci/test-installer-bash-resolution.py
          # The release version lives in the npm meta package, and four other
          # places have to equal it (six platform packages, the pins, the two
          # crates that build the binary, the CHANGELOG section). A drift only
          # surfaces after a tag is public: the updater compares a --version
          # string from one file against a feed built from another.
          python3 scripts/ci/check-version-lockstep.py
          # The recon script is the one command a maintainer runs against upstream, and
          # its record is named by date plus the upstream tip, so a second run on the
          # same UTC day used to redirect over the first. On 2026-10-03 that replaced a
          # hand-enriched record with the generated table and nothing failed. These
          # fixtures drive the shipped script against a local bare repo and a loopback
          # compare API, pinning both promises in its header: a record is never
          # overwritten, and a comparison that failed writes no record at all.
          python3 scripts/ci/test-upstream-recon.py
          # Who runs the guards? Three of them had been committed, documented and
          # never invoked -- which is how the TODO status document drifted 13 rows
          # from TODO.md while a checker that would have caught it sat unused.
          # This walks `.github/workflows/*.yml` plus scripts/verify-in-docker.sh,
          # follows the calls into lab scripts, and refuses a gate in scripts/ci/
          # that nothing executes. Its own fixtures are what prove the walk still
          # treats a comment, a doc and a real invocation differently.
          python3 scripts/ci/test-check-guard-wiring.py
          python3 scripts/ci/check-guard-wiring.py
          # The same question one directory up. The check above accounts for scripts/ci/,
          # so the acceptance labs in scripts/ belonged to nobody: on 2026-10-04 five of
          # the six `*-in-docker.sh` files were named by no workflow, and the transcripts
          # they had last produced were two days and thirty-odd commits behind the tree.
          # A lab is either named on an executable line of a workflow -- this job's own
          # steps, and the scheduled `docker-labs.yml` -- or it carries a dated row in
          # scripts/ci/docker-labs.tsv saying what CI cannot supply. A row past its date
          # budget is a failure too, and prints the command that would refresh it.
          python3 scripts/ci/test-check-lab-coverage.py
          python3 scripts/ci/check-lab-coverage.py
          # Which browser specs run is decided by a hand-written list inside each Playwright config
          # plus a second list in `apps/chaos-ui/e2e-runner.mjs`, and a spec outside both is not an
          # error: Playwright collects the files it matches, reports the tests it found, exits 0.
          # The suite here is 14 specs over 2 configs whose names are re-typed in five places, and
          # `playwright.config.ts` sets `testMatch` at the top level and again in all three of its
          # projects, where a project's list replaces the top level rather than narrowing it -- so
          # a new name written only at the top registers nothing at all. This reads the configs the
          # way Playwright does, and fails on a spec nothing collects, a project collecting nothing,
          # a name no spec satisfies any more, and a config no runner names.
          python3 scripts/ci/test-check-e2e-registration.py
          python3 scripts/ci/check-e2e-registration.py
          # THIRD-PARTY-NOTICES is 19 000 lines of legal text with no reader in the repository: a
          # pointer at a Part II section that is not in the file sends a reader looking for a license
          # text that is not in the distribution they are holding, and nothing but this check notices.
          # It is text-only, so it runs here and in the container; its companion, which compares the
          # entries against `cargo metadata`, is the `rust` job step above. These fixtures also pin
          # the generator's promises -- a surviving entry comes back byte for byte, a license text is
          # taken verbatim from the package that ships it, and a run that cannot decide a license
          # writes nothing at all.
          python3 scripts/ci/test-check-notices-document.py
          python3 scripts/ci/check-notices-document.py
          python3 scripts/ci/test-gen-third-party-notices.py
